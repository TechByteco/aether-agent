user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75;
    keepalive_requests 1000;
    server_tokens      off;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_min_length    1000;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    # 10 requests/sec per IP, with zone of 10 MB (holds ~160k IPs)
    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # ── Upstream: 2 obscura-api replicas ─────────────────────────────────────
    upstream obscura_backend {
        least_conn;
        server obscura-api:8000 max_fails=3 fail_timeout=30s;
        # Docker Compose with replicas exposes same DNS name; both instances
        # are resolved via Docker's internal round-robin. least_conn picks
        # the least busy at connection time.
        keepalive 32;
    }

    # ── Main Server ───────────────────────────────────────────────────────────
    server {
        listen       80 default_server;
        server_name  _;

        # ── Security Headers ─────────────────────────────────────────────────
        add_header X-Frame-Options           "DENY"                              always;
        add_header X-Content-Type-Options    "nosniff"                           always;
        add_header X-XSS-Protection          "1; mode=block"                     always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none';"
            always;
        add_header Permissions-Policy        "geolocation=(), microphone=()"     always;

        # ── /metrics — internal only ──────────────────────────────────────────
        location /metrics {
            allow 127.0.0.1;
            allow 172.16.0.0/12;   # Docker internal networks
            deny  all;

            proxy_pass         http://obscura_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ── Health check (no rate limit) ──────────────────────────────────────
        location /health {
            proxy_pass         http://obscura_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 10s;
        }

        # ── API endpoints ─────────────────────────────────────────────────────
        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://obscura_backend;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # ── Timeouts ─────────────────────────────────────────────────────
            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            # ── Buffering ────────────────────────────────────────────────────
            proxy_buffering          on;
            proxy_buffer_size        16k;
            proxy_buffers            8 16k;
            proxy_busy_buffers_size  32k;

            # ── Error handling ───────────────────────────────────────────────
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # ── SSE streaming (disable buffering) ─────────────────────────────────
        location /sse/ {
            limit_req zone=api_limit burst=5 nodelay;

            proxy_pass         http://obscura_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;  # Long-lived SSE connections
            chunked_transfer_encoding on;
        }

        # ── 429 response body ─────────────────────────────────────────────────
        error_page 429 /429.json;
        location = /429.json {
            internal;
            return 429 '{"error":"rate_limit_exceeded","message":"Too many requests. Max 10/s per IP."}';
            add_header Content-Type application/json always;
        }
    }
}
