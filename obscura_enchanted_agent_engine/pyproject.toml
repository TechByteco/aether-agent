[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obscura-enchanted-agent-engine"
version = "1.0.0"
authors = [
  { name="TechByte AI Team", email="engineering@techbyte.co" },
]
description = "Enchanted Obscura Engine for Autonomous AI Agents - Ultra-lightweight 30MB V8 headless browser with Semantic DOM Token Distillation, Mutation Diffing, and Enhanced MCP Server."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "lxml>=5.2.0",
]

[project.scripts]
obscura-agent = "obscura_engine.cli:main"

[project.urls]
"Homepage" = "https://github.com/TechByteco/obscura_enchanted_agent_engine"
"Bug Tracker" = "https://github.com/TechByteco/obscura_enchanted_agent_engine/issues"
