services:
  - type: web
    name: aether-sovereign-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn aether.web.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: src
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: CALENDAR_ICS_URL
        sync: false
